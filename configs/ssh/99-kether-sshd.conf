# Kether_1 — OpenSSH 10.0p1 Hardening Drop-In (Debian 13 Trixie)
# WARNING: Ensure your SSH public key is installed in ~/.ssh/authorized_keys
#          before reloading sshd.
# Install:
#   sudo cp configs/ssh/99-kether-sshd.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t && sudo systemctl reload ssh

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
GatewayPorts no
PermitTunnel no
PrintMotd no

# Post-quantum hybrid KEX + AEAD ciphers (OpenSSH 10.0p1 / Debian 13)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,diffie-hellman-group16-sha512
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
