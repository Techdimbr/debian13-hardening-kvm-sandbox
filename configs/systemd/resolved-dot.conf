# Kether_1 — systemd-resolved DNS-over-TLS & DNSSEC Drop-In (Debian 13)
# Install:
#   sudo mkdir -p /etc/systemd/resolved.conf.d
#   sudo cp configs/systemd/resolved-dot.conf /etc/systemd/resolved.conf.d/99-kether.conf
#   sudo systemctl restart systemd-resolved

[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 8.8.8.8#dns.google
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
DNSOverTLS=yes
DNSSEC=yes
MulticastDNS=no
LLMNR=no
