# Kether_1 — systemd-journald Retention & Integrity Drop-In (Debian 13)
# Install:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp configs/systemd/journald-kether.conf /etc/systemd/journald.conf.d/99-kether.conf
#   sudo systemctl restart systemd-journald

[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
MaxRetentionSec=30day
MaxFileSec=1month
Compress=yes
ForwardToSyslog=yes
