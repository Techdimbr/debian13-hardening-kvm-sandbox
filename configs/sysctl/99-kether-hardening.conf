###############################################################################
# Kether_1 — Debian 13 (Trixie, Kernel 6.12 LTS) Sysctl Hardening Baseline
# Target: Workstations & Servers executing Autonomous AI Agents
# Standards: CIS Debian Linux Benchmark Level 2 + Google BeyondCorp Zero Trust
# Author: Eng. Deivis Irio Mayer (Kether1) — ORCID: 0009-0003-3273-7883
# License: MIT
# Install: sudo cp configs/sysctl/99-kether-hardening.conf /etc/sysctl.d/
#          sudo sysctl --system
###############################################################################

## LAYER 2 — NETWORK STACK ANTI-SPOOFING & ROUTING HARDENING
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

## LAYER 2 — KERNEL MEMORY, POINTERS & BPF HARDENING
kernel.randomize_va_space = 2
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3
kernel.yama.ptrace_scope = 1
kernel.kexec_load_disabled = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

## LAYER 2/3 — SELECTIVE USERNS COMPATIBILITY FOR AI AGENT SANDBOXES
# Kether_1 Design Decision:
# Rather than breaking rootless containers and agent sandboxes globally via
# kernel.unprivileged_userns_clone=0, user namespaces remain available to the
# kernel and are selectively mediated by AppArmor 4.x userns restriction
# (kernel.apparmor_restrict_unprivileged_userns=1) paired with explicit
# per-runtime AppArmor profiles (see configs/apparmor/kether-ai-agent-userns).
kernel.unprivileged_userns_clone = 1

## CORE DUMPS — PREVENT CREDENTIAL LEAKAGE ON CRASH
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

## FILESYSTEM — SYMLINK, HARDLINK & FIFO/REGULAR PROTECTIONS
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

## WORKSTATION / HYPERVISOR PERFORMANCE TUNING (SSD + KVM)
vm.swappiness = 10
vm.vfs_cache_pressure = 50
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 2048
